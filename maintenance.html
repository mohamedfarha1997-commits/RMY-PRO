<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<meta name="robots" content="noindex">
<title>RMY | البرنامج تحت التحديث</title>
<style>html,body{margin:0;height:100%;background:#1E3A5F}</style>
<style>
#pmMaint{position:fixed;inset:0;z-index:30000;display:none;align-items:center;justify-content:center;padding:24px;overflow:hidden;
  background:radial-gradient(900px 600px at 50% -12%,rgba(232,164,108,.28),transparent 62%),linear-gradient(160deg,#1E3A5F 0%,#FFFDF6 55%,#2F7DB8 100%);
  color:#FFF8E7;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl}
#pmMaint.show{display:flex;animation:pmmIn .45s ease-out both}
#pmMaint::before,#pmMaint::after{content:"";position:absolute;border-radius:50%;filter:blur(46px);opacity:.38;pointer-events:none}
#pmMaint::before{width:340px;height:340px;background:#FFF1CC;top:-130px;right:-110px;animation:pmmFloat 9s ease-in-out infinite}
#pmMaint::after{width:280px;height:280px;background:#9A5B00;bottom:-120px;left:-90px;animation:pmmFloat 12s ease-in-out infinite reverse}
#pmMaint .pmm-card{position:relative;z-index:1;width:min(100%,440px);text-align:center;padding:34px 26px 26px;border-radius:30px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.55);animation:pmmRise .6s cubic-bezier(.2,.8,.2,1) both}
.pmm-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;padding:6px 13px;border-radius:99px;
  background:rgba(232,164,108,.16);color:#FFD9B8;border:1px solid rgba(232,164,108,.34)}
.pmm-badge i{width:7px;height:7px;border-radius:50%;background:#F2B233;animation:pmmPulse 1.6s infinite}
.pmm-ico{position:relative;width:98px;height:98px;margin:22px auto 18px;display:grid;place-items:center;border-radius:30px;
  background:linear-gradient(145deg,#FFF1CC,#9A5B00);box-shadow:0 18px 44px -14px rgba(232,164,108,.65)}
.pmm-ico::after{content:"";position:absolute;inset:-9px;border-radius:36px;border:1.5px dashed rgba(255,217,184,.35);animation:pmmSpin 24s linear infinite}
.pmm-ico svg{width:44px;height:44px;color:#1E3A5F;animation:pmmSwing 3.6s ease-in-out infinite;transform-origin:50% 50%}
#pmMaint h1{font-size:25px;margin:0 0 10px;font-weight:900;letter-spacing:-.2px}
#pmMaintMsg{margin:0 0 8px;color:rgba(255,248,243,.93);line-height:1.85;font-weight:600;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.pmm-since{font-size:12.5px;color:rgba(255,248,243,.58);margin:0 0 22px;min-height:1.2em}
.pmm-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:0 0 24px;position:relative}
.pmm-bar::after{content:"";position:absolute;top:0;bottom:0;width:38%;border-radius:inherit;background:linear-gradient(90deg,transparent,#F2B233,transparent);animation:pmmSlide 1.7s ease-in-out infinite}
#pmMaint button#pmMaintOut{width:100%;min-height:48px;border-radius:15px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#FFF8E7;transition:background .2s,transform .15s}
#pmMaint button#pmMaintOut:hover{background:rgba(255,255,255,.2)}
#pmMaint button#pmMaintOut:active{transform:scale(.985)}
.pmm-foot{margin-top:16px;font-size:11.5px;color:rgba(255,248,243,.5)}
@keyframes pmmIn{from{opacity:0}to{opacity:1}}
@keyframes pmmRise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pmmFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-14px)}}
@keyframes pmmSpin{to{transform:rotate(360deg)}}
@keyframes pmmSwing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes pmmSlide{from{right:-40%}to{right:102%}}
@keyframes pmmPulse{0%{box-shadow:0 0 0 0 rgba(245,178,122,.6)}70%{box-shadow:0 0 0 8px rgba(245,178,122,0)}100%{box-shadow:0 0 0 0 rgba(245,178,122,0)}}
@media (prefers-reduced-motion:reduce){#pmMaint,#pmMaint *,#pmMaint::before,#pmMaint::after{animation:none!important}}
@media (max-width:420px){#pmMaint h1{font-size:22px}#pmMaint .pmm-card{padding:28px 20px 22px}}
.pmm-count{margin:0 0 22px}
.pmm-count[hidden]{display:none!important}
.pmm-count-label{font-size:12.5px;color:rgba(255,248,243,.75);margin:0 0 10px;font-weight:700}
.pmm-count-grid{display:flex;justify-content:center;align-items:stretch;gap:8px}
.pmm-count-grid>div{flex:1 1 0;min-width:0;max-width:96px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 4px;text-align:center}
.pmm-count-grid b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;color:#FFF8E7}
.pmm-count-grid span{font-size:11px;color:rgba(255,248,243,.6)}
</style>
<link rel="stylesheet" href="css/125-maintenance-palette.css">
</head>
<body>
<div id="pmMaint" class="show" role="alertdialog" aria-modal="true" aria-labelledby="pmMaintTitle" aria-describedby="pmMaintMsg">
  <div class="pmm-card">
    <span class="pmm-badge"><i aria-hidden="true"></i>وضع الصيانة مفعّل</span>
    <div class="pmm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
    <h1 id="pmMaintTitle">البرنامج تحت التحديث</h1>
    <p id="pmMaintMsg">بنحدّث البرنامج دلوقتي عشان نقدّم لك تجربة أحسن. برجاء المحاولة بعد قليل.</p>
    <div id="pmMaintSince" class="pmm-since"></div>
    <div id="pmMaintCount" class="pmm-count" hidden>
  <div id="pmMaintCountLabel" class="pmm-count-label">باقي على انتهاء الصيانة</div>
  <div class="pmm-count-grid">
    <div id="pmC_dw"><b id="pmC_d">00</b><span>يوم</span></div>
    <div><b id="pmC_h">00</b><span>ساعة</span></div>
    <div><b id="pmC_m">00</b><span>دقيقة</span></div>
    <div><b id="pmC_s">00</b><span>ثانية</span></div>
  </div>
</div>
    <div class="pmm-bar" aria-hidden="true"></div>
    <button type="button" id="pmMaintOut" onclick="location.reload()">إعادة المحاولة</button>
    <div class="pmm-foot">شكرًا لصبرك، هنرجع قريب 🤍</div>
  </div>
</div>
<script>
/* ===== إعدادات الصفحة: عدّل هنا بس ===== */
var MAINT_MESSAGE = 'بنحدّث البرنامج دلوقتي عشان نقدّم لك تجربة أحسن. برجاء المحاولة بعد قليل.';
/* وقت الانتهاء بصيغة ISO مع الـ offset بتاع مصر (+02:00 شتاءً أو +03:00 صيفًا).
   مثال: '2026-10-23T18:00:00+02:00' — سيبه '' لو الوقت مش معروف (من غير عد تنازلي) */
var MAINT_UNTIL = '';
/* ===================================== */
(function(){
  var msgEl=document.getElementById('pmMaintMsg');
  var sinceEl=document.getElementById('pmMaintSince');
  var box=document.getElementById('pmMaintCount');
  var label=document.getElementById('pmMaintCountLabel');
  var until=MAINT_UNTIL?Date.parse(MAINT_UNTIL):NaN;
  function pad(n){ return (n<10?'0':'')+n; }
  msgEl.textContent=MAINT_MESSAGE;
  if(isNaN(until)){ box.hidden=true; return; }
  sinceEl.textContent='المتوقع تنتهي الساعة '+new Date(until).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  function set(id,v){ document.getElementById(id).textContent=v; }
  function tick(){
    var diff=until-Date.now();
    if(diff<=0){
      label.textContent='الوقت المحدد خلص، جرّب تحدّث الصفحة بعد شوية';
      set('pmC_d','00'); set('pmC_h','00'); set('pmC_m','00'); set('pmC_s','00');
      document.getElementById('pmC_dw').hidden=true;
      return;
    }
    var s=Math.floor(diff/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
    document.getElementById('pmC_dw').hidden=(d===0);
    set('pmC_d',pad(d)); set('pmC_h',pad(h)); set('pmC_m',pad(m)); set('pmC_s',pad(sec));
  }
  tick();
  setInterval(tick,1000);
})();
</script>

</body>
</html>
