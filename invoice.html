<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>فاتورة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F7F2EF;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;color:#1E3A5F}
.wrap{max-width:460px;margin:18px auto;padding:0 12px}
.paper{background:#fff;border:1px solid #FFF1CC;border-radius:18px;padding:16px;box-shadow:0 18px 40px rgba(62,36,21,.12)}
.inv-top{background:linear-gradient(135deg,#1E3A5F 0%,#2F7DB8 100%);color:#fff;border-radius:14px;padding:18px 14px;text-align:center}
.inv-shop{font-size:22px;font-weight:900}
.inv-sub{font-size:12px;opacity:.92;margin-top:3px}
.inv-tax{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#4A6583;padding:10px 0 2px}
.inv-tax span{background:#FFFDF6;border:1px solid #FFF1CC;border-radius:999px;padding:3px 10px}
.inv-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.inv-meta>div{background:#FFFDF6;border:1px solid #FFF1CC;border-radius:12px;padding:8px 6px;text-align:center}
.inv-meta small{display:block;color:#4A6583;font-size:11px;margin-bottom:2px}
.inv-meta b{font-size:12.5px;word-break:break-word}
.inv-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;border:1px solid #FFF1CC;border-radius:12px;overflow:hidden}
.inv-tbl th{background:#1E3A5F;color:#fff;padding:9px 6px;font-weight:800;text-align:center}
.inv-tbl td{padding:9px 6px;text-align:center;border-top:1px solid #F6F1EE}
.inv-tbl tr.alt td{background:#FCF9F8}
.inv-tbl .nm{text-align:start;padding-inline-start:12px}
.inv-tbl td.tot{font-weight:800;color:#1E3A5F}
.inv-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.inv-note{font-size:12px;color:#4A6583;flex:1;min-width:140px}
.inv-total{background:linear-gradient(135deg,#1E3A5F 0%,#2F7DB8 100%);color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:14px;align-items:center}
.inv-total span{font-size:13px;opacity:.9}
.inv-total b{font-size:17px}
.inv-foot{text-align:center;color:#4A6583;font-size:12px;margin-top:16px;padding-top:10px;border-top:1px dashed #E2D6CF}
.actions{display:flex;gap:8px;margin:12px 0 0}
.actions button{flex:1;border:0;border-radius:12px;padding:13px 8px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#2F7DB8,#1E3A5F);color:#fff}
.inv-cust{background:#FFFDF6;border:1px solid #FFF1CC;border-radius:12px;padding:8px 10px;margin:0 0 12px;font-size:12.5px;text-align:center}
.msg{text-align:center;padding:30px 10px;color:#4A6583;line-height:1.9}
.langbar{display:flex;gap:8px;margin:10px 0 0}
.langbar button{flex:1;border:1px solid #E6D6CA;background:#fff;color:#1E3A5F;border-radius:12px;padding:10px 8px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.langbar button.on{background:#2F7DB8;color:#fff;border-color:#2F7DB8}
@media print{
  @page{size:80mm auto;margin:3mm}
  body{background:#fff}
  .wrap{max-width:none;margin:0;padding:0}
  .paper{border:0;box-shadow:none;padding:0;border-radius:0}
  .actions,.langbar{display:none!important}
  .inv{font-size:10.5px;color:#1E3A5F}
  .inv-top{background:none!important;color:#1E3A5F!important;border:1px solid #F0D9A3!important;border-radius:0!important;padding:8px 6px!important}
  .inv-shop{font-size:15px!important}
  .inv-sub{opacity:1!important}
  .inv-tax span,.inv-meta>div{background:none!important;border:1px solid #F0D9A3!important;border-radius:0!important;color:#1E3A5F!important}
  .inv-meta{grid-template-columns:1fr 1fr 1fr!important;gap:3px!important;margin:6px 0!important}
  .inv-meta small{color:#1E3A5F!important;font-size:9px!important}
  .inv-meta b{font-size:10px!important}
  .inv-tbl{border:0!important;border-radius:0!important;font-size:10px!important}
  .inv-tbl th{background:none!important;color:#1E3A5F!important;border-bottom:1px solid #F0D9A3!important;padding:4px 2px!important}
  .inv-tbl td{padding:4px 2px!important;border-top:1px dashed #F0D9A3!important;color:#1E3A5F!important}
  .inv-tbl tr.alt td{background:none!important}
  .inv-tbl td.tot{color:#1E3A5F!important}
  .inv-sum{flex-direction:column!important;align-items:stretch!important;gap:6px!important}
  .inv-total{background:none!important;color:#1E3A5F!important;border:1px solid #F0D9A3!important;border-radius:0!important;justify-content:space-between!important;padding:6px!important}
  .inv-total span,.inv-total b{color:#1E3A5F!important;opacity:1!important}
  .inv-foot{border-top:1px dashed #F0D9A3!important;color:#1E3A5F!important}
  .inv-cust{border:1px solid #F0D9A3!important;background:none!important;border-radius:0!important;color:#1E3A5F!important;font-size:10px!important;padding:4px!important}
  .inv-tbl,.inv-meta,.inv-total,.inv-tax{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="paper" id="paper"><div class="msg">جارٍ تحميل الفاتورة…</div></div>
  <div class="langbar" id="langBar"><button type="button" data-l="ar">عربي</button><button type="button" data-l="en">English</button></div><div class="actions"><button type="button" id="printBtn">🖨️ طباعة / حفظ PDF</button></div>
</div>
<script>
(function(){
  var T={
    ar:{no:'رقم الفاتورة',date:'التاريخ',by:'البائع',cust:'العميل',phone:'التليفون',item:'الصنف',qty:'الكمية',price:'السعر',total:'الإجمالي',cur:'ج.م',note:'ملاحظة',cr:'السجل التجاري',tax:'البطاقة الضريبية',thanks:'شكراً لزيارتكم',print:'🖨️ طباعة / حفظ PDF',err:'تعذر فتح الفاتورة. تأكد إن الرابط كامل ومنسوخ من الكود بالظبط.',dir:'rtl'},
    en:{no:'Invoice No.',date:'Date',by:'Cashier',cust:'Customer',phone:'Phone',item:'Item',qty:'Qty',price:'Price',total:'Total',cur:'EGP',note:'Note',cr:'Commercial Reg.',tax:'Tax Card',thanks:'Thank you for your visit',print:'🖨️ Print / Save PDF',err:'Invoice could not be opened. Make sure the link is complete.',dir:'ltr'}
  };
  var AR_THANKS='شكراً لزيارتكم';
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }
  function money(v){ return (Math.round((Number(v)||0)*100)/100).toFixed(2) }
  function decode(b64u){
    var s=b64u.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    var bin=atob(s), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function render(d,lang){
    var L=T[lang], en=(lang==='en');
    var lines=(d.l||[]), sum=0;
    var rows=lines.map(function(l,i){
      sum+=Number(l[3])||0;
      var name=(en && d.en && d.en.l && d.en.l[i]) ? d.en.l[i] : l[0];
      return '<tr class="'+(i%2?'alt':'')+'"><td class="nm">'+esc(name)+'</td><td>'+esc(l[1])+'</td><td>'+money(l[2])+'</td><td class="tot">'+money(l[3])+'</td></tr>';
    }).join('');
    var total=(d.tt!=null)?Number(d.tt):sum;
    var cname=(en && d.en && d.en.cn) ? d.en.cn : (d.cn||'');
    var cust=(cname||d.cp)?'<div class="inv-cust">'+L.cust+': <b>'+esc(cname||'—')+'</b>'+(d.cp?' &nbsp;·&nbsp; '+L.phone+': <b dir="ltr">'+esc(d.cp)+'</b>':'')+'</div>':'';
    var foot=d.f||''; if(en && foot===AR_THANKS) foot=L.thanks;
    return '<div class="inv">'+
      '<div class="inv-top"><div class="inv-shop">'+esc(d.s)+'</div>'+
        (d.a?'<div class="inv-sub">'+esc(d.a)+'</div>':'')+
        (d.p?'<div class="inv-sub" dir="ltr">'+esc(d.p)+'</div>':'')+'</div>'+
      ((d.c||d.t)?'<div class="inv-tax">'+(d.c?'<span>'+L.cr+': '+esc(d.c)+'</span>':'')+(d.t?'<span>'+L.tax+': '+esc(d.t)+'</span>':'')+'</div>':'')+
      '<div class="inv-meta"><div><small>'+L.no+'</small><b>'+esc(d.n)+'</b></div>'+
        '<div><small>'+L.date+'</small><b dir="ltr">'+esc(d.d||'')+'</b></div>'+
        '<div><small>'+L.by+'</small><b>'+esc(d.b||'')+'</b></div></div>'+
      cust+'<table class="inv-tbl"><thead><tr><th class="nm">'+L.item+'</th><th>'+L.qty+'</th><th>'+L.price+'</th><th>'+L.total+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="inv-sum"><div class="inv-note">'+(d.o&&d.o!==(d.cn||'')?L.note+': '+esc(d.o):'')+'</div>'+
        '<div class="inv-total"><span>'+L.total+'</span><b>'+money(total)+' '+L.cur+'</b></div></div>'+
      (foot?'<div class="inv-foot">'+esc(foot)+'</div>':'')+
      '</div>';
  }
  var paper=document.getElementById('paper'), printBtn=document.getElementById('printBtn');
  var langBar=document.getElementById('langBar');
  var data=null;
  try{
    var h=location.hash.replace(/^#/,'');
    if(!h)throw new Error('no data');
    data=decode(h);
    if(!data||data.v!==1)throw new Error('bad');
  }catch(e){ data=null; }

  function show(lang){
    document.documentElement.lang=(lang==='en')?'en':'ar';
    document.documentElement.dir=T[lang].dir;
    if(!data){ paper.innerHTML='<div class="msg">'+T[lang].err+'</div>'; }
    else { paper.innerHTML=render(data,lang); document.title=(lang==='en'?'Invoice ':'فاتورة ')+data.n; }
    printBtn.textContent=T[lang].print;
    langBar.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l')===lang); });
  }

  var initial=(new URLSearchParams(location.search).get('lang')==='en')?'en':'ar';
  show(initial);

  langBar.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-l]'); if(!b) return;
    var l=b.getAttribute('data-l');
    show(l);
    try{ var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(null,'',u.toString()); }catch(err){}
  });
  printBtn.addEventListener('click',function(){ window.print() });
})();
</script>
</body>
</html>
